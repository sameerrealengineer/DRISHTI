[project]
name = "drishti-api"
version = "0.1.0"
description = "DRISHTI Ganjam API + workers (FastAPI, Celery)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "geoalchemy2==0.16.0",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "shapely==2.0.6",
  "redis==5.2.1",
  "celery==5.4.0",
  "passlib[argon2]==1.7.4",
  "cryptography==44.0.0",
  "pyjwt==2.10.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "httpx==0.28.1",
  "ruff==0.8.4",
  "mypy==1.14.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "UP"]
"../../scripts/*" = ["E501"]
"tests/*" = ["E501"]
